<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Key Generator</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --bg-glow: #1e1b4b;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --accent-hover: #059669;
            --accent-soft: rgba(16, 185, 129, 0.30);
            --accent-soft-hover: rgba(16, 185, 129, 0.45);
            --danger: #ef4444;
        }

        /* ------- Minimal themes ------- */
        body[data-theme="ocean"] {
            --bg-color: #08131f;
            --bg-glow: #0b3b52;
            --panel-bg: rgba(14, 32, 48, 0.7);
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --accent-soft: rgba(56, 189, 248, 0.30);
            --accent-soft-hover: rgba(56, 189, 248, 0.45);
        }

        body[data-theme="violet"] {
            --bg-color: #100d1c;
            --bg-glow: #2e1065;
            --panel-bg: rgba(32, 26, 51, 0.7);
            --accent: #a78bfa;
            --accent-hover: #8b5cf6;
            --accent-soft: rgba(167, 139, 250, 0.30);
            --accent-soft-hover: rgba(167, 139, 250, 0.45);
        }

        body[data-theme="rose"] {
            --bg-color: #17090e;
            --bg-glow: #4c0519;
            --panel-bg: rgba(45, 18, 26, 0.7);
            --accent: #fb7185;
            --accent-hover: #f43f5e;
            --accent-soft: rgba(251, 113, 133, 0.30);
            --accent-soft-hover: rgba(251, 113, 133, 0.45);
        }

        * { box-sizing: border-box; }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px 16px;
            background: radial-gradient(circle at bottom right, var(--bg-glow), var(--bg-color));
            background-color: var(--bg-color);
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: var(--text-main);
            transition: background-color .35s ease;
        }

        .page {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            width: 100%;
            max-width: 380px;
        }

        .generator-card {
            position: relative;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* ------- Theme switcher ------- */
        .theme-bar {
            position: absolute;
            top: 16px;
            right: 16px;
            display: flex;
            gap: 7px;
        }

        .theme-dot {
            width: 11px;
            height: 11px;
            padding: 0;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            opacity: .55;
            transition: transform .2s ease, opacity .2s ease, box-shadow .2s ease;
        }

        .theme-dot:hover { transform: scale(1.25); opacity: 1; }

        .theme-dot.active {
            opacity: 1;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.8);
        }

        .theme-dot[data-theme="emerald"] { background: #10b981; }
        .theme-dot[data-theme="ocean"]   { background: #38bdf8; }
        .theme-dot[data-theme="violet"]  { background: #a78bfa; }
        .theme-dot[data-theme="rose"]    { background: #fb7185; }

        h2 {
            margin-top: 0;
            margin-bottom: 24px;
            font-weight: 600;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .output-container {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .output-field {
            flex-grow: 1;
            width: 100%;
            min-width: 0;
            background: transparent;
            border: none;
            color: var(--accent);
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 16px;
            outline: none;
            letter-spacing: 1px;
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: var(--text-muted);
            padding: 0 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
        }

        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }

        .settings { margin-bottom: 24px; }

        .slider-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .slider-group label {
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .slider-value {
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: 600;
            color: var(--accent);
            min-width: 38px;
            text-align: center;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            font-size: 0.9rem;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
        }

        .checkbox-label input {
            margin-right: 8px;
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .generate-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: var(--accent);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px 0 var(--accent-soft);
        }

        .generate-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px 0 var(--accent-soft-hover);
        }

        .generate-btn:active { transform: translateY(0); }

        /* ------- Footer ------- */
        .footer {
            font-size: 0.8rem;
            letter-spacing: 0.4px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 5px;
            opacity: .85;
        }

        .footer .heart {
            display: inline-block;
            font-size: 0.95rem;
            animation: beat 1.6s ease-in-out infinite;
        }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.2); }
        }

        @media (prefers-reduced-motion: reduce) {
            .footer .heart { animation: none; }
        }
    </style>
</head>
<body data-theme="emerald">

    <div class="page">
        <div class="generator-card">
            <div class="theme-bar" role="group" aria-label="Color theme">
                <button class="theme-dot active" data-theme="emerald" title="Emerald" aria-label="Emerald theme"></button>
                <button class="theme-dot" data-theme="ocean" title="Ocean" aria-label="Ocean theme"></button>
                <button class="theme-dot" data-theme="violet" title="Violet" aria-label="Violet theme"></button>
                <button class="theme-dot" data-theme="rose" title="Rose" aria-label="Rose theme"></button>
            </div>

            <h2>Key Generator</h2>

            <div class="output-container">
                <input type="text" id="passwordOutput" class="output-field" readonly value="">
                <button class="copy-btn" id="copyBtn">COPY</button>
            </div>

            <div class="settings">
                <div class="slider-group">
                    <label for="lengthSlider">Length</label>
                    <span class="slider-value" id="lengthValue">16</span>
                </div>
                <input type="range" id="lengthSlider" min="8" max="32" value="16">

                <div class="checkbox-group" style="margin-top: 20px;">
                    <label class="checkbox-label">
                        <input type="checkbox" id="chkUpper" checked> Uppercase
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="chkLower" checked> Lowercase
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="chkNumbers" checked> Numbers
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="chkSymbols" checked> Symbols
                    </label>
                </div>
            </div>

            <button class="generate-btn" id="generateBtn">Generate Password</button>
        </div>

        <footer class="footer">
            Made with <span class="heart">❤️</span>
        </footer>
    </div>

    <script>
        const upperChars  = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const lowerChars  = "abcdefghijklmnopqrstuvwxyz";
        const numberChars = "0123456789";
        const symbolChars = "!@#$%^&*()_+~`|}{[]:;?><,./-=";

        const passwordOutput = document.getElementById('passwordOutput');
        const lengthSlider   = document.getElementById('lengthSlider');
        const lengthValue    = document.getElementById('lengthValue');
        const copyBtn        = document.getElementById('copyBtn');
        const generateBtn    = document.getElementById('generateBtn');

        const chkUpper   = document.getElementById('chkUpper');
        const chkLower   = document.getElementById('chkLower');
        const chkNumbers = document.getElementById('chkNumbers');
        const chkSymbols = document.getElementById('chkSymbols');

        let copyTimer = null;

        /* ---------- Password generation ---------- */
        function generatePassword() {
            const length = parseInt(lengthSlider.value, 10);
            const useUpper   = chkUpper.checked;
            const useLower   = chkLower.checked;
            const useNumbers = chkNumbers.checked;
            const useSymbols = chkSymbols.checked;

            if (!useUpper && !useLower && !useNumbers && !useSymbols) {
                passwordOutput.value = "Select at least one option!";
                passwordOutput.style.color = "var(--danger)";
                return;
            }

            let charPool = "";
            if (useUpper)   charPool += upperChars;
            if (useLower)   charPool += lowerChars;
            if (useNumbers) charPool += numberChars;
            if (useSymbols) charPool += symbolChars;

            // Use crypto if available for better randomness
            const cryptoObj = window.crypto || window.msCrypto;
            let generatedPassword = "";

            if (cryptoObj && cryptoObj.getRandomValues) {
                const randomValues = new Uint32Array(length);
                cryptoObj.getRandomValues(randomValues);
                for (let i = 0; i < length; i++) {
                    generatedPassword += charPool[randomValues[i] % charPool.length];
                }
            } else {
                for (let i = 0; i < length; i++) {
                    generatedPassword += charPool[Math.floor(Math.random() * charPool.length)];
                }
            }

            passwordOutput.value = generatedPassword;
            passwordOutput.style.color = "var(--accent)";

            if (copyTimer) clearTimeout(copyTimer);
            copyBtn.textContent = "COPY";
        }

        function updateLengthLabel() {
            lengthValue.textContent = lengthSlider.value;
        }

        /* ---------- Instant regeneration ---------- */
        lengthSlider.addEventListener('input', () => {
            updateLengthLabel();
            generatePassword();          // live preview while dragging
        });

        [chkUpper, chkLower, chkNumbers, chkSymbols].forEach(chk => {
            chk.addEventListener('change', generatePassword);
        });

        generateBtn.addEventListener('click', generatePassword);

        /* ---------- Copy ---------- */
        copyBtn.addEventListener('click', () => {
            const textToCopy = passwordOutput.value;
            if (!textToCopy || textToCopy.includes("Select at least")) return;

            navigator.clipboard.writeText(textToCopy).then(() => {
                copyBtn.textContent = "COPIED!";
                if (copyTimer) clearTimeout(copyTimer);
                copyTimer = setTimeout(() => {
                    copyBtn.textContent = "COPY";
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        });

        /* ---------- Themes ---------- */
        const themeDots = document.querySelectorAll('.theme-dot');

        function applyTheme(theme) {
            document.body.dataset.theme = theme;
            themeDots.forEach(dot => {
                dot.classList.toggle('active', dot.dataset.theme === theme);
            });
            try { localStorage.setItem('keygen-theme', theme); } catch (e) {}
        }

        themeDots.forEach(dot => {
            dot.addEventListener('click', () => applyTheme(dot.dataset.theme));
        });

        (function initTheme() {
            let saved = null;
            try { saved = localStorage.getItem('keygen-theme'); } catch (e) {}
            if (saved && document.querySelector('.theme-dot[data-theme="' + saved + '"]')) {
                applyTheme(saved);
            }
        })();

        /* ---------- Init ---------- */
        window.addEventListener('load', () => {
            updateLengthLabel();
            generatePassword();
        });
    </script>
</body>
</html>
